<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardvane — AI Security Platform</title>
  
  <!-- Favicon & Touch Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  
  <!-- Newsreader (Serif), Inter (Sans) & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..500;1,6..72,400..500&display=swap" rel="stylesheet">
  
  <!-- Design System Tokens -->
  <link rel="stylesheet" href="/static/css/tokens.css?v=20261118_claude_v2">
  
  <!-- Tailwind CSS via CDN -->
  <script>
    // Suppress Tailwind Play CDN production advisory warning in console
    (function() {
      var _warn = console.warn;
      console.warn = function() {
        if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('cdn.tailwindcss.com should not be used in production') !== -1) {
          return;
        }
        return _warn.apply(console, arguments);
      };
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            app: {
              bg: 'var(--bg)',
              surface: 'var(--surface)',
              sunk: 'var(--surface-sunk)',
              border: 'var(--border)',
              'border-strong': 'var(--border-strong)',
              text: 'var(--text)',
              'text-2': 'var(--text-2)',
              'text-3': 'var(--text-3)',
              accent: 'var(--accent)',
              'accent-hover': 'var(--accent-hover)',
              'accent-soft': 'var(--accent-soft)',
            }
          },
          fontFamily: {
            serif: ['Newsreader', 'Source Serif 4', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>
  
  <!-- Custom Console Stylesheet -->
  <link rel="stylesheet" href="/static/css/console.css">
  
  <!-- Ethers.js library for MetaMask & SIWE integration -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>

</head>
<body class="bg-[var(--bg)] text-[var(--text)] antialiased selection:bg-[var(--accent-soft)] selection:text-[var(--accent)] font-sans">
  <div id="app-root"></div>

  <!-- Arkiv SDK Browser Bundle -->
  <script src="/static/js/arkiv-browser.js"></script>

  <!-- App Script -->
  <script src="/static/js/app.js?v=20261118_claude_v2"></script>
</body>
</html>
