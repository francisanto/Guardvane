name: Guardvane CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python bytecode syntax
        run: |
          python -m py_compile $(git ls-files '*.py')

      - name: Verify module imports and application entry points
        run: |
          python -c "
          import main
          assert main.app.title == 'Guardvane AI', 'FastAPI app title mismatch'

          import auth.router, auth.service, auth.schemas
          import marketplace.router, marketplace.service, marketplace.catalogue, marketplace.platform_agents, marketplace.db, marketplace.schemas
          import integrations.zero_g.config, integrations.zero_g.client, integrations.zero_g.reasoning, integrations.zero_g.optimization, integrations.zero_g.sanitizer, integrations.zero_g.cache
          import integrations.arkiv.client, integrations.arkiv.schemas, integrations.arkiv.server_writer
          import payments.service, payments.gateway, payments.evm_escrow
          import db.models, db.database

          print('✓ All core Guardvane modules and subpackages imported cleanly.')
          "

      - name: Verify database ORM models and schema integrity
        run: |
          python -c "
          from sqlalchemy import create_engine
          from db.database import Base
          import db.models

          # Validate all declarative models and relationships using in-memory engine
          test_engine = create_engine('sqlite:///:memory:')
          Base.metadata.create_all(test_engine)
          tables = list(Base.metadata.tables.keys())
          expected_tables = ['users', 'user_roles', 'auth_nonces', 'providers', 'services', 'orders', 'reports', 'saved_prompts', 'payment_intents']
          for t in expected_tables:
              assert t in tables, f'Expected table {t} missing from schema'
          print(f'✓ Verified {len(tables)} database models and schema definitions successfully: {tables}')
          "

      - name: Verify 0G sanitizer and offline reasoning engine
        run: |
          ZG_ENABLED=false python -c "
          from integrations.zero_g.sanitizer import detect_sensitive_data
          res = detect_sensitive_data('API key sk-1234567890abcdef1234567890abcdef and password Password123!')
          assert res['detected'] is True, 'Sensitive data detector failed to flag credentials'
          assert res['findings_count'] >= 1, 'Expected at least 1 finding'

          from integrations.zero_g import zero_g_optimizer
          opt = zero_g_optimizer.optimize('Test prompt for offline optimization')
          assert opt.status == 'local_only', f'Expected local_only status, got {opt.status}'
          assert opt.engine == 'local_only', f'Expected local_only engine, got {opt.engine}'
          assert len(opt.optimized_prompt) > 0, 'Optimized prompt must not be empty'
          print('✓ 0G offline security reasoning & credential sanitizer validated successfully.')
          "

      - name: Verify FastAPI route signatures and OpenAPI schema
        run: |
          python -c "
          from main import app
          schema = app.openapi()
          routes = [route.path for route in app.routes]
          assert len(routes) >= 20, f'Expected substantial route table, found {len(routes)}'
          assert 'paths' in schema, 'OpenAPI schema missing paths'
          assert '/auth/nonce' in schema['paths'], 'Missing /auth/nonce in OpenAPI schema'
          assert '/marketplace/orders' in schema['paths'], 'Missing /marketplace/orders in OpenAPI schema'
          print(f'✓ FastAPI route table and OpenAPI v{schema.get(\"openapi\")} schema validated across {len(routes)} routes.')
          "

      - name: Execute pytest test suite
        run: |
          pytest -v || {
            exit_code=$?
            if [ $exit_code -eq 5 ]; then
              echo "Pytest completed: 0 tests collected (no test files present in repository)."
            else
              exit $exit_code
            fi
          }
